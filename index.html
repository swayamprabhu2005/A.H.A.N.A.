<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AHANA - Acoustic Holographic Autonomous Neural Assistant</title>
  </head>
  <body>
    <!-- Background grid overlay -->
    <div class="cyber-grid"></div>
    <!-- Cinematic vignette -->
    <div class="vignette"></div>

    <div id="app-container">
      <!-- 3D Scene Viewport -->
      <canvas id="webgl-canvas"></canvas>

      <!-- HUD Header -->
      <header class="hud-header">
        <h1 class="hud-title" id="hud-title-text">A.H.A.N.A.</h1>
        <div class="hud-status" id="system-status">
          <span class="status-dot" id="system-status-dot"></span>
          <span id="status-text">SYSTEM ACTIVE</span>
        </div>
      </header>

      <!-- Audio & Captions Dashboard (Left Sidebar) -->
      <aside class="audio-dashboard glass-panel" id="audio-dashboard-container">
        <h2 class="panel-section-title">Acoustic Interface</h2>
        
        <div class="panel-section">
          <label style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 0.4rem; display: block; letter-spacing: 1px;">Voice Vibration</label>
          <div class="voice-vibration-panel" id="voice-vibration-panel">
            <!-- Dynamic vibration bars will be populated by index.ts -->
          </div>
        </div>

        <div class="panel-section" style="margin-top: 1.2rem;">
          <label style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 0.4rem; display: block; letter-spacing: 1px;">Transmission Feedback</label>
          <div class="caption-toggle-container">
            <span class="toggle-text">Show Captions</span>
            <label class="switch">
              <input type="checkbox" id="toggle-captions" checked>
              <span class="slider round"></span>
            </label>
          </div>
        </div>

        <!-- Embedded Captions Box -->
        <div class="panel-section" id="sidebar-subtitles-container" style="margin-top: 1.2rem; display: block;">
          <label style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 0.4rem; display: block; letter-spacing: 1px;">Captions Stream</label>
          <div class="subtitles-box" id="speech-subtitles">
            <p id="subtitles-text"></p>
          </div>
        </div>
      </aside>

      <!-- Controls Panel (Left Sidebar) -->
      <aside class="controls-panel glass-panel" id="controls-panel-container">
        <div class="panel-section">
          <h2 class="panel-section-title">Facial Expression Rig</h2>
          <div class="button-grid">
            <button class="control-btn active" id="btn-expr-neutral" data-expr="neutral">Neutral</button>
            <button class="control-btn" id="btn-expr-smile" data-expr="smile">Smile</button>
            <button class="control-btn" id="btn-expr-angry" data-expr="angry">Angry</button>
            <button class="control-btn" id="btn-expr-surprise" data-expr="surprise">Surprise</button>
            <button class="control-btn" id="btn-expr-sad" data-expr="sad">Sad</button>
            <button class="control-btn" id="btn-expr-thinking" data-expr="thinking">Thinking</button>
            <button class="control-btn" id="btn-expr-confused" data-expr="confused">Confused</button>
            <button class="control-btn" id="btn-expr-listening" data-expr="listening">Listening</button>
          </div>
        </div>

        <div class="panel-section">
          <h2 class="panel-section-title">Voice Synthesis Configuration</h2>
          <div style="display: flex; flex-direction: column; gap: 0.6rem;">
            <div>
              <label style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 0.2rem; display: block;">Voice Mode</label>
              <select class="select-control" id="select-tts-mode">
                <option value="webspeech">Mode 1: Browser Speech Synthesis</option>
                <option value="huggingface">Mode 2: Hugging Face (Lightweight)</option>
              </select>
            </div>
            
            <div id="hf-model-select-container" style="display: none;">
              <label style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 0.2rem; display: block;">HF Model</label>
              <select class="select-control" id="select-hf-model">
                <option value="facebook/mms-tts-eng">MMS-TTS English (MMS)</option>
                <option value="microsoft/speecht5_tts">SpeechT5 (Microsoft)</option>
              </select>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <h2 class="panel-section-title">Audio Spectrum</h2>
          <div class="voice-speaking-indicator" id="speaking-indicator">
            <div class="speaking-wave">
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
            </div>
            <span>TRANSMITTING AUDIO</span>
          </div>
          <div class="audio-visualizer-container" id="visualizer-bars">
            <!-- Bars will be generated by script -->
          </div>
          <div style="margin-top: 0.8rem; display: flex; gap: 0.4rem;">
            <button class="control-btn stop" id="btn-stop-audio" style="flex: 1;">Stop Audio</button>
            <button class="control-btn" id="btn-toggle-mic" style="flex: 1;">Microphone</button>
          </div>
        </div>
      </aside>

      <!-- Chat Panel (Right Sidebar) -->
      <aside class="chat-panel glass-panel" id="chat-panel-container">
        <h2 class="panel-section-title">Neural Chat Interface</h2>
        <div class="chat-history" id="chat-messages">
          <div class="message avatar">
            <span class="message-label">Neural Avatar AI</span>
            Greetings Operator. I am online. What do you want to ask today?
          </div>
        </div>
        <div class="chat-input-container">
          <button class="chat-mic-btn" id="btn-chat-mic" title="Speak to Gemini">🎤</button>
          <input
            type="text"
            class="chat-input"
            id="user-chat-input"
            placeholder="Transmit query to Gemini..."
            autocomplete="off"
          />
          <button class="send-btn" id="btn-send-message">SEND</button>
        </div>
      </aside>
    </div>

    <!-- Main JS Application script module -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
